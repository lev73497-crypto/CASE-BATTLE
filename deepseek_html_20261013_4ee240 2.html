<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кейс Баттл</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body {
    background: radial-gradient(circle at top, #1a1f3a 0%, #0a0d1a 100%);
    color: #e0e0e0;
    min-height: 100vh;
    padding: 15px;
  }
  .container { max-width: 1300px; margin: 0 auto; }

  header {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    background: rgba(20,25,50,0.85);
    border: 1px solid #2a3560;
    border-radius: 12px;
    padding: 12px 20px;
    margin-bottom: 15px;
    box-shadow: 0 0 20px rgba(80,120,255,0.15);
  }
  h1 {
    font-size: 22px;
    background: linear-gradient(90deg, #6ea8ff, #b47aff, #ff7ab4);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: 1px;
  }
  .stats { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
  .stat {
    background: linear-gradient(135deg, #1c2444, #2a3560);
    border: 1px solid #3a4a80;
    border-radius: 8px;
    padding: 8px 14px;
    font-weight: 600;
    font-size: 14px;
    display: flex; align-items: center; gap: 6px;
  }
  .stat .money { color: #ffd54a; }
  .stat .label { color: #8fa0cc; font-weight: 400; font-size: 12px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
  .tab {
    flex: 1; min-width: 120px;
    background: rgba(20,25,50,0.7);
    border: 1px solid #2a3560;
    color: #8fa0cc;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    transition: all 0.2s;
    text-align: center;
  }
  .tab:hover { background: rgba(40,50,90,0.9); color: #c0d0ff; }
  .tab.active {
    background: linear-gradient(135deg, #3a4a90, #5a3a90);
    color: #fff;
    border-color: #6ea8ff;
    box-shadow: 0 0 15px rgba(110,168,255,0.4);
  }
  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ============= SKIN VISUAL ============= */
  .skin-visual {
    width: 100%;
    height: 80px;
    border-radius: 8px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    background: #0a0d1a;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
  }
  .skin-visual::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15), transparent 60%);
    z-index: 1;
  }
  .skin-visual::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    animation: shine 3s infinite;
    z-index: 2;
  }
  @keyframes shine {
    0% { left: -100%; }
    100% { left: 200%; }
  }
  .skin-visual .weapon-emoji {
    font-size: 48px;
    filter: drop-shadow(0 0 8px currentColor);
    position: relative;
    z-index: 3;
    transform: rotate(-15deg);
  }
  .skin-visual .weapon-name-tag {
    position: absolute;
    bottom: 3px; left: 5px;
    font-size: 9px;
    color: rgba(255,255,255,0.75);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    z-index: 4;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  .skin-visual .float-badge {
    position: absolute;
    top: 3px; right: 5px;
    font-size: 9px;
    color: #fff;
    background: rgba(0,0,0,0.6);
    padding: 1px 5px;
    border-radius: 4px;
    z-index: 4;
    font-weight: 700;
  }

  /* ============= CASES ============= */
  .cases-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
  }
  .case-card {
    background: linear-gradient(160deg, #1a2044, #12162e);
    border: 2px solid #2a3560;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    transition: all 0.3s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .case-card::before {
    content: '';
    position: absolute;
    inset: -2px;
    background: linear-gradient(135deg, transparent, currentColor, transparent);
    border-radius: 16px;
    opacity: 0.15;
    z-index: 0;
    animation: rotateGlow 4s linear infinite;
  }
  @keyframes rotateGlow {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }
  .case-card:hover {
    transform: translateY(-8px) scale(1.02);
    border-color: #6ea8ff;
    box-shadow: 0 15px 40px rgba(110,168,255,0.35);
  }
  .case-card .case-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 30%, currentColor, transparent 60%);
    opacity: 0.12;
    z-index: 0;
  }
  .case-inner { position: relative; z-index: 1; }
  .case-emoji {
    font-size: 68px;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 15px currentColor);
    display: inline-block;
    animation: floatCase 3s ease-in-out infinite;
  }
  @keyframes floatCase {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .case-name { font-size: 18px; font-weight: 800; margin-bottom: 6px; color: #d0e0ff; }
  .case-price { color: #ffd54a; font-weight: 800; margin-bottom: 14px; font-size: 17px; }
  .case-chances {
    font-size: 10px; color: #8fa0cc; margin-bottom: 14px;
    display: flex; gap: 4px; flex-wrap: wrap; justify-content: center;
  }
  .chance-pill {
    padding: 2px 6px; border-radius: 4px; font-weight: 700;
    background: rgba(0,0,0,0.4);
  }

  /* ============= BUTTONS ============= */
  .btn {
    background: linear-gradient(135deg, #3a6ad0, #6a3ad0);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
    width: 100%;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.2); transform: scale(1.02); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.sell { background: linear-gradient(135deg, #3aa060, #30a0a0); }
  .btn.upgrade { background: linear-gradient(135deg, #a03ad0, #d03a8a); font-size: 17px; padding: 16px; letter-spacing: 1px; }
  .btn.small { padding: 6px 10px; font-size: 12px; width: auto; }
  .btn.ghost { background: rgba(60,80,140,0.4); border: 1px solid #3a4a80; }

  /* ============= CASE OPENING MODAL ============= */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 500;
    display: none;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; animation: fadeIn 0.2s; }

  .case-open-modal {
    background: linear-gradient(160deg, #141a38, #0a0d20);
    border: 2px solid #3a4a80;
    border-radius: 20px;
    padding: 30px;
    max-width: 900px;
    width: 100%;
    text-align: center;
    position: relative;
    box-shadow: 0 0 60px rgba(110,168,255,0.4);
  }
  .case-open-modal h2 {
    margin-bottom: 20px;
    font-size: 22px;
    background: linear-gradient(90deg, #6ea8ff, #b47aff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .open-roulette {
    position: relative;
    height: 160px;
    background: #060812;
    border-radius: 12px;
    border: 2px solid #1a2044;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .open-track {
    display: flex;
    position: absolute;
    top: 0; left: 0;
    height: 100%;
  }
  .open-item {
    width: 160px;
    height: 100%;
    flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-right: 1px solid rgba(255,255,255,0.05);
    padding: 8px;
  }
  .open-item .skin-visual { height: 90px; margin-bottom: 4px; }
  .open-item .skin-visual .weapon-emoji { font-size: 46px; }
  .open-item .name { font-size: 11px; color: #c0d0ff; font-weight: 700; text-align: center; line-height: 1.15; }
  .open-pointer {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 4px; height: 100%;
    background: linear-gradient(180deg, transparent, #ffd54a, #ffd54a, transparent);
    z-index: 10;
    box-shadow: 0 0 20px #ffd54a;
  }
  .open-pointer::before, .open-pointer::after {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
  }
  .open-pointer::before { top: -2px; border-top: 12px solid #ffd54a; }
  .open-pointer::after { bottom: -2px; border-bottom: 12px solid #ffd54a; }

  .open-result {
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 15px;
  }
  .open-result .result-card {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    padding: 15px 25px;
    border-radius: 14px;
    background: rgba(20,25,50,0.9);
    border: 2px solid;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    opacity: 0;
  }
  @keyframes popIn {
    0% { transform: scale(0.3); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .open-result .result-card .skin-visual { width: 200px; height: 110px; }
  .open-result .result-card .name { font-size: 16px; font-weight: 800; margin-top: 10px; }
  .open-result .result-card .price { color: #ffd54a; font-weight: 800; margin-top: 4px; }
  .open-result .result-card .rarity-tag { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

  /* ============= UPGRADER ============= */
  .upgrader {
    display: grid;
    grid-template-columns: 1fr 340px 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 950px) { .upgrader { grid-template-columns: 1fr; } }

  .upg-side-title {
    font-size: 13px; color: #8fa0cc; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 8px;
  }
  .upg-slot {
    background: linear-gradient(160deg, #1a2044, #12162e);
    border: 2px solid #2a3560;
    border-radius: 14px;
    padding: 16px;
    min-height: 240px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
    transition: all 0.25s;
  }
  .upg-slot.empty {
    border-style: dashed;
    color: #6a7a9a;
    font-size: 14px;
    text-align: center;
  }
  .upg-slot .skin-visual { height: 110px; width: 100%; }
  .upg-slot .skin-visual .weapon-emoji { font-size: 65px; }
  .upg-slot .name { font-weight: 800; margin: 12px 0 6px; font-size: 16px; text-align: center; }
  .upg-slot .price { color: #ffd54a; font-weight: 800; font-size: 18px; }
  .upg-slot .rarity-tag { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; }

  .upg-center {
    background: linear-gradient(160deg, #141a38, #0d1128);
    border: 2px solid #2a3560;
    border-radius: 16px;
    padding: 20px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }

  .upg-multiplier { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; width: 100%; }
  .mult-btn {
    background: rgba(30,40,80,0.7);
    border: 1px solid #3a4a80;
    color: #c0d0ff;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 800;
    font-size: 13px;
    transition: all 0.15s;
    min-width: 42px;
  }
  .mult-btn:hover:not(:disabled) { background: rgba(60,80,140,0.9); transform: scale(1.05); }
  .mult-btn.active {
    background: linear-gradient(135deg, #3a6ad0, #6a3ad0);
    color: #fff; border-color: #6ea8ff;
    box-shadow: 0 0 12px rgba(110,168,255,0.6);
    transform: scale(1.08);
  }
  .mult-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Wheel with spinning arrow */
  .wheel-wrapper {
    position: relative;
    width: 260px;
    height: 260px;
    margin: 5px 0;
  }
  .wheel-outer {
    position: absolute; inset: 0;
    border-radius: 50%;
    box-shadow: 0 0 40px rgba(110,168,255,0.35), inset 0 0 30px rgba(0,0,0,0.8);
    border: 4px solid #2a3560;
    overflow: hidden;
    background: #0a0d1a;
  }
  .wheel-outer svg { display: block; width: 100%; height: 100%; }

  .wheel-arrow {
    position: absolute;
    top: 50%; left: 50%;
    width: 50%;
    height: 6px;
    transform-origin: 0 50%;
    z-index: 30;
    pointer-events: none;
    transform: translateY(-50%) rotate(0deg);
  }
  .wheel-arrow::before {
    content: '';
    position: absolute;
    right: -10px;
    top: 50%;
    transform: translateY(-50%);
    width: 0;
    height: 0;
    border-top: 12px solid transparent;
    border-bottom: 12px solid transparent;
    border-left: 22px solid #ffd54a;
    filter: drop-shadow(0 0 10px #ffd54a) drop-shadow(0 0 4px #ff8a00);
  }
  .wheel-arrow::after {
    content: '';
    position: absolute;
    left: 0; top: 50%;
    transform: translateY(-50%);
    width: 100%; height: 3px;
    background: linear-gradient(90deg, transparent, #ffd54a 40%, #ffd54a);
    box-shadow: 0 0 8px #ffd54a;
    border-radius: 2px;
  }
  .wheel-arrow.spinning {
    transition: transform 5s cubic-bezier(0.18, 0.85, 0.25, 1);
  }
  .wheel-arrow.instant { transition: none; }
  .wheel-hub {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 55px; height: 55px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #4a5aa0, #1a2044);
    border: 3px solid #6ea8ff;
    z-index: 25;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: 0 0 20px rgba(110,168,255,0.7);
  }

  .upg-info { text-align: center; width: 100%; }
  .upg-info .chance-line { font-size: 13px; color: #8fa0cc; margin-bottom: 4px; }
  .upg-info .chance-big {
    font-size: 34px; font-weight: 900;
    background: linear-gradient(90deg, #4aa05a, #a0ffa0);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    line-height: 1;
    transition: all 0.3s;
  }
  .upg-info .chance-big.low { background: linear-gradient(90deg, #ff3a5a, #ff8a5a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .upg-info .chance-big.mid { background: linear-gradient(90deg, #ffd54a, #ffaa3a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .upg-info .profit { font-size: 13px; color: #8fa0cc; margin-top: 8px; }
  .upg-info .profit .plus { color: #4aa05a; font-weight: 800; }
  .upg-info .profit .minus { color: #d03a3a; font-weight: 800; }

  .upg-result { min-height: 26px; text-align: center; font-weight: 800; font-size: 15px; }

  .upg-picker { margin-top: 25px; }
  .upg-picker-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .upg-picker-header h3 { font-size: 16px; color: #c0d0ff; }
  .upg-picker-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
    max-height: 460px;
    overflow-y: auto;
    padding-right: 5px;
  }
  .upg-picker-grid::-webkit-scrollbar { width: 8px; }
  .upg-picker-grid::-webkit-scrollbar-thumb { background: #2a3560; border-radius: 4px; }
  .upg-picker-grid::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }

  .picker-item {
    background: linear-gradient(160deg, #1a2044, #12162e);
    border-radius: 10px;
    padding: 8px;
    text-align: center;
    border: 2px solid;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .picker-item:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(110,168,255,0.35); }
  .picker-item.selected { outline: 3px solid #6ea8ff; box-shadow: 0 0 25px rgba(110,168,255,0.6); }
  .picker-item .skin-visual { height: 60px; margin-bottom: 4px; }
  .picker-item .skin-visual .weapon-emoji { font-size: 34px; }
  .picker-item .name { font-size: 11px; font-weight: 700; line-height: 1.15; min-height: 26px; }
  .picker-item .price { color: #ffd54a; font-weight: 800; font-size: 12px; margin-top: 4px; }

  /* ============= INVENTORY ============= */
  .inventory-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 12px;
  }
  .inv-item {
    background: linear-gradient(160deg, #1a2044, #12162e);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    border: 2px solid;
    transition: transform 0.2s;
  }
  .inv-item:hover { transform: translateY(-3px); }
  .inv-item .name { font-size: 12px; font-weight: 700; margin: 6px 0 4px; line-height: 1.2; min-height: 28px; }
  .inv-item .price { color: #ffd54a; font-weight: 800; font-size: 13px; margin-bottom: 8px; }
  .inv-item .rarity-tag { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }

  .rarity-common { border-color: #6a7a9a; }
  .rarity-uncommon { border-color: #4aa05a; }
  .rarity-rare { border-color: #3a6ad0; }
  .rarity-epic { border-color: #a03ad0; }
  .rarity-legendary { border-color: #ffd54a; box-shadow: 0 0 15px rgba(255,213,74,0.3); }
  .rarity-mythic { border-color: #ff3a5a; box-shadow: 0 0 20px rgba(255,58,90,0.5); }

  .empty-msg { text-align: center; padding: 40px; color: #6a7a9a; font-size: 15px; }

  /* ============= BATTLE ============= */
  .roulette-wrap {
    background: #0a0d1a;
    border: 1px solid #2a3560;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 15px;
  }
  .roulette {
    position: relative;
    overflow: hidden;
    height: 160px;
    background: #060812;
    border-radius: 10px;
    border: 2px solid #1a2044;
  }
  .roulette-track {
    display: flex;
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    transition: transform 6s cubic-bezier(0.15, 0.9, 0.25, 1);
  }
  .roulette-item {
    width: 150px;
    height: 100%;
    flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-right: 1px solid rgba(255,255,255,0.05);
    padding: 8px;
  }
  .roulette-item .skin-visual { height: 80px; margin-bottom: 4px; }
  .roulette-item .skin-visual .weapon-emoji { font-size: 42px; }
  .roulette-item .name { font-size: 11px; color: #c0d0ff; font-weight: 700; text-align: center; line-height: 1.1; }
  .pointer {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 4px; height: 100%;
    background: linear-gradient(180deg, transparent, #ffd54a, #ffd54a, transparent);
    z-index: 10;
    box-shadow: 0 0 20px #ffd54a;
  }
  .pointer::before, .pointer::after {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
  }
  .pointer::before { top: -2px; border-top: 12px solid #ffd54a; }
  .pointer::after { bottom: -2px; border-bottom: 12px solid #ffd54a; }

  .result-popup { text-align: center; margin-top: 12px; font-size: 16px; font-weight: 700; min-height: 24px; }

  .case-selector { margin-bottom: 15px; }
  .case-selector label { color: #8fa0cc; margin-right: 8px; font-size: 14px; }
  .case-selector select {
    background: #1a2044; color: #e0e0e0; border: 1px solid #3a4a80;
    padding: 8px 12px; border-radius: 8px; font-size: 14px; cursor: pointer;
  }

  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
    background: linear-gradient(135deg, #3a6ad0, #6a3ad0);
    color: #fff; padding: 14px 28px; border-radius: 10px;
    font-weight: 800; z-index: 1000;
    transition: transform 0.4s; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    max-width: 90vw; text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { background: linear-gradient(135deg, #d03a3a, #a02020); }
  .toast.success { background: linear-gradient(135deg, #3aa060, #20a070); }

  .section-title {
    font-size: 18px; font-weight: 800; margin-bottom: 15px; color: #c0d0ff;
    display: flex; justify-content: space-between; align-items: center;
  }

  @media (max-width: 600px) {

    .roulette-item { width: 120px; }

  }
</style>
</head>
<body>

<!-- CASE OPENING MODAL -->

    <button class="btn" id="closeModalBtn" style="max-width:200px; margin:0 auto; display:none;">Забрать</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ================== ДАННЫЕ ==================
const RARITIES = {
  common:    { name: 'Обычный',     color: '#6a7a9a' },
  uncommon:  { name: 'Необычный',   color: '#4aa05a' },

};

const WEAPONS = {
  glock:  { name: 'Glock-18',  emoji: '🔫' },
  usp:    { name: 'USP-S',     emoji: '🔫' },
  p250:   { name: 'P250',      emoji: '🔫' },
  deagle: { name: 'Desert Eagle', emoji: '🔫' },

  m4a4:   { name: 'M4A4',      emoji: '🔫' },
  m4a1s:  { name: 'M4A1-S',    emoji: '🔫' },
  awp:    { name: 'AWP',       emoji: '🎯' },
  ssg:    { name: 'SSG 08',    emoji: '🎯' },
  butterfly: { name: 'Нож Бабочка', emoji: '🔪' },
  karambit:  { name: 'Керамбит',    emoji: '🗡️' },
  bayonet:   { name: 'Штык-Нож',    emoji: '🗡️' },

  gloves:    { name: 'Перчатки',    emoji: '🧤' }
};

const SKINS_POOL = [
  { weapon: 'glock',  skinName: 'Гроза',          price: 100,  rarity: 'common',    colors: ['#3a4a7a', '#1a2044'] },
  { weapon: 'usp',    skinName: 'Лес',            price: 130,  rarity: 'common',    colors: ['#2a5a2a', '#1a3a1a'] },
  { weapon: 'p250',   skinName: 'Пепел',          price: 150,  rarity: 'common',    colors: ['#5a5a5a', '#2a2a2a'] },
  { weapon: 'ak47',   skinName: 'Синий Ламинат',  price: 180,  rarity: 'common',    colors: ['#2a4a9a', '#0a1a4a'] },
  { weapon: 'm4a4',   skinName: 'Пустыня',        price: 220,  rarity: 'common',    colors: ['#b09060', '#6a5030'] },
  { weapon: 'deagle', skinName: 'Бронза',         price: 350,  rarity: 'uncommon',  colors: ['#a07020', '#5a3a10'] },
  { weapon: 'fiveseven', skinName: 'Неон',        price: 420,  rarity: 'uncommon',  colors: ['#20d0a0', '#0a5a4a'] },
  { weapon: 'm4a1s',  skinName: 'Неон Райдер',    price: 500,  rarity: 'uncommon',  colors: ['#d040c0', '#3a1040'] },
  { weapon: 'butterfly', skinName: 'Сталь',       price: 650,  rarity: 'uncommon',  colors: ['#c0c0c0', '#404040'] },
  { weapon: 'awp',    skinName: 'Лазурь',         price: 850,  rarity: 'rare',      colors: ['#3060d0', '#101a50'] },
  { weapon: 'ak47',   skinName: 'Красная Линия',  price: 1100, rarity: 'rare',      colors: ['#d03030', '#5a1010'] },
  { weapon: 'm4a4',   skinName: 'Кибер',          price: 1400, rarity: 'rare',      colors: ['#00d0ff', '#0a3050'] },
  { weapon: 'ssg',    skinName: 'Кровавое Дерево',price: 1800, rarity: 'rare',      colors: ['#8a1010', '#3a0000'] },
  { weapon: 'awp',    skinName: 'Неоновая Революция', price: 2500, rarity: 'epic',   colors: ['#00ff88', '#ff00aa'] },
  { weapon: 'karambit', skinName: 'Синий',        price: 3200, rarity: 'epic',      colors: ['#2060d0', '#0a1a50'] },
  { weapon: 'gloves', skinName: 'Спорт',          price: 4000, rarity: 'epic',      colors: ['#d0a040', '#3a2a10'] },
  { weapon: 'awp',    skinName: 'Дракон',         price: 5500, rarity: 'epic',      colors: ['#20a050', '#0a3a20'] },
  { weapon: 'bayonet', skinName: 'Градиент',      price: 8500, rarity: 'legendary', colors: ['#ff30a0', '#30a0ff'] },
  { weapon: 'karambit', skinName: 'Убийца',       price: 12000, rarity: 'legendary', colors: ['#ff5050', '#3a0a0a'] },
  { weapon: 'gloves', skinName: 'Бога',           price: 16000, rarity: 'legendary', colors: ['#ffd54a', '#8a5a10'] },
  { weapon: 'karambit', skinName: 'Изумруд',      price: 25000, rarity: 'mythic',    colors: ['#00ff80', '#0a3a20'] },
  { weapon: 'm9',     skinName: 'Кровавая Паутина', price: 35000, rarity: 'mythic',  colors: ['#ff2030', '#4a0010'] },
  { weapon: 'awp',    skinName: 'Драконий Лор',   price: 60000, rarity: 'mythic',    colors: ['#ff2030', '#101040'] }
];

const CASES = [
  {
    id: 'bronze', name: 'Бронзовый', emoji: '📦', price: 100, color: '#a07020',
    weights: { common: 65, uncommon: 25, rare: 8, epic: 1.8, legendary: 0.2, mythic: 0 }
  },
  {
    id: 'silver', name: 'Серебряный', emoji: '🎁', price: 500, color: '#c0c0c0',
    weights: { common: 40, uncommon: 35, rare: 18, epic: 6, legendary: 0.9, mythic: 0.1 }
  },
  {
    id: 'gold', name: 'Золотой', emoji: '💼', price: 2500, color: '#ffd54a',
    weights: { common: 15, uncommon: 30, rare: 32, epic: 18, legendary: 4.5, mythic: 0.5 }
  },
  {
    id: 'diamond', name: 'Алмазный', emoji: '💎', price: 10000, color: '#00d0ff',
    weights: { common: 3, uncommon: 12, rare: 30, epic: 38, legendary: 15, mythic: 2 }
  },
  {
    id: 'mythic', name: 'Мифический', emoji: '👑', price: 50000, color: '#ff3a5a',
    weights: { common: 0, uncommon: 0, rare: 8, epic: 30, legendary: 47, mythic: 15 }
  }
];

const MULTIPLIERS = [1.5, 2, 3, 5, 10, 20];

// ================== СОСТОЯНИЕ ==================
let state = {
  balance: 500,
  inventory: [],
  totalOpened: 0,
  totalSpent: 0
};

let upgradeFromSkin = null;
let upgradeMultiplier = 2;
let selectedBattleCase = 'bronze';
let spinning = false;
let wheelSpinning = false;
let openingModal = false;

// ================== LOCALSTORAGE ==================
function save() { localStorage.setItem('caseBattleSave_v4', JSON.stringify(state)); }
function load() {
  try {
    const s = localStorage.getItem('caseBattleSave_v4');
    if (s) state = Object.assign(state, JSON.parse(s));
  } catch(e) {}
}

// ================== УТИЛИТЫ ==================
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function formatMoney(n) { return Math.round(n).toLocaleString('ru-RU') + ' ₽'; }

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = 'toast ' + type; }, 2400);
}

function randomByWeights(weights) {
  const total = Object.values(weights).reduce((a,b)=>a+b, 0);
  let r = Math.random() * total;
  for (const [rarity, w] of Object.entries(weights)) {
    if (r < w) return rarity;
    r -= w;
  }
  return 'common';
}

function rollSkin(caseObj) {
  const rarity = randomByWeights(caseObj.weights);
  let pool = SKINS_POOL.filter(s => s.rarity === rarity);
  if (pool.length === 0) {
    for (const r of ['legendary','epic','rare','uncommon','common']) {
      pool = SKINS_POOL.filter(s => s.rarity === r);
      if (pool.length) break;
    }
  }
  const base = pool[Math.floor(Math.random() * pool.length)];
  const variation = 0.9 + Math.random() * 0.2;
  const floatVal = (Math.random() * 0.5 + 0.01).toFixed(3);
  return {
    id: uid(),
    weapon: base.weapon,
    weaponName: WEAPONS[base.weapon].name,
    weaponEmoji: WEAPONS[base.weapon].emoji,
    skinName: base.skinName,
    name: WEAPONS[base.weapon].name + ' | ' + base.skinName,
    price: Math.round(base.price * variation),
    rarity: base.rarity,
    colors: base.colors,
    float: floatVal
  };
}

function skinVisualHTML(skin, showFloat = true) {
  const c1 = skin.colors[0], c2 = skin.colors[1];
  const rar = RARITIES[skin.rarity];
  return `
    <div class="skin-visual" style="background: linear-gradient(135deg, ${c1}, ${c2}); border: 1px solid ${rar.color}66; color: ${rar.color};">
      <div class="weapon-emoji">${skin.weaponEmoji}</div>
      <div class="weapon-name-tag">${skin.weaponName || WEAPONS[skin.weapon].name}</div>
      ${showFloat ? `<div class="float-badge" style="color:${rar.color}">${skin.float}</div>` : ''}
    </div>
  `;
}

// ================== UI ==================
function updateStats() {
  document.getElementById('balance').textContent = formatMoney(state.balance);
  document.getElementById('invCount').textContent = state.inventory.length;
  const total = state.inventory.reduce((s,i)=>s+i.price, 0);
  document.getElementById('totalValue').textContent = formatMoney(total);
}

// ================== CASES ==================
function renderCases() {
  const grid = document.getElementById('casesGrid');
  grid.innerHTML = '';
  CASES.forEach(c => {
    const card = document.createElement('div');
    card.className = 'case-card';
    card.style.color = c.color;
    const raritiesHTML = Object.entries(c.weights)
      .filter(([_,w]) => w > 0)
      .map(([r,w]) => {
        const col = RARITIES[r].color;
        return `<span class="chance-pill" style="color:${col}; border:1px solid ${col}44;">${r.charAt(0).toUpperCase()}: ${w}%</span>`;
      }).join('');
    card.innerHTML = `
      <div class="case-glow"></div>
      <div class="case-inner">
        <div class="case-emoji">${c.emoji}</div>
        <div class="case-name">${c.name} кейс</div>
        <div class="case-price">${formatMoney(c.price)}</div>
        <div class="case-chances">${raritiesHTML}</div>
        <button class="btn" data-open="${c.id}" ${state.balance < c.price ? 'disabled' : ''}>🔓 Открыть</button>
      </div>
    `;
    grid.appendChild(card);
  });

  grid.querySelectorAll('[data-open]').forEach(btn => {
    btn.addEventListener('click', () => openCaseAnimated(btn.dataset.open));
  });
}

// ================== CASE OPENING ANIMATION ==================
function openCaseAnimated(caseId) {
  if (openingModal) return;
  const c = CASES.find(x => x.id === caseId);
  if (!c) return;
  if (state.balance < c.price) { showToast('Недостаточно средств!', 'error'); return; }

  openingModal = true;
  state.balance -= c.price;
  state.totalSpent += c.price;
  state.totalOpened++;
  updateStats();
  renderCases();

  const modal = document.getElementById('caseModal');
  document.getElementById('modalTitle').textContent = `${c.emoji} ${c.name} кейс`;
  document.getElementById('openResult').innerHTML = '';
  document.getElementById('closeModalBtn').style.display = 'none';
  modal.classList.add('show');

  const track = document.getElementById('openTrack');
  track.innerHTML = '';
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';

  const itemW = window.innerWidth < 600 ? 130 : 160;
  const itemCount = 60;
  // Рандомная позиция выигрыша по всей длине ленты
  const winIndex = 20 + Math.floor(Math.random() * (itemCount - 40));

  let winSkin = null;
  const items = [];
  for (let i = 0; i < itemCount; i++) {
    if (i === winIndex) {
      winSkin = rollSkin(c);
      items.push(winSkin);
    } else {
      items.push(rollSkin(c));
    }
  }

  items.forEach(skin => {
    const el = document.createElement('div');
    el.className = 'open-item';
    const rar = RARITIES[skin.rarity];
    el.style.borderTop = `4px solid ${rar.color}`;
    el.style.background = `linear-gradient(180deg, ${rar.color}22, transparent)`;
    el.innerHTML = `
      ${skinVisualHTML(skin, false)}
      <div class="name">${skin.name}</div>
    `;
    track.appendChild(el);
  });

  const container = track.parentElement;
  const containerW = container.offsetWidth;
  const centerOffset = containerW / 2 - itemW / 2;
  // Добавляем случайное смещение внутри предмета — указатель может попасть в любую точку
  const jitter = (Math.random() - 0.5) * (itemW * 0.6);
  const targetX = -(winIndex * itemW) + centerOffset + jitter;

  setTimeout(() => {
    track.style.transition = 'transform 5.5s cubic-bezier(0.12, 0.9, 0.2, 1)';
    track.style.transform = `translateX(${targetX}px)`;
  }, 50);

  setTimeout(() => {
    state.inventory.push(winSkin);
    save();
    updateStats();
    renderInventory();
    renderUpgradePicker();
    renderCases();

    const rar = RARITIES[winSkin.rarity];
    document.getElementById('openResult').innerHTML = `
      <div class="result-card" style="border-color:${rar.color}; box-shadow: 0 0 30px ${rar.color}66;">
        ${skinVisualHTML(winSkin)}
        <div class="name">${winSkin.name}</div>
        <div class="price">${formatMoney(winSkin.price)}</div>
        <div class="rarity-tag" style="color:${rar.color}">${rar.name}</div>
      </div>
    `;
    document.getElementById('closeModalBtn').style.display = 'block';

    if (winSkin.rarity === 'mythic' || winSkin.rarity === 'legendary') {
      showToast(`🎉 ${winSkin.name}!`, 'success');
    }
    openingModal = false;
  }, 5600);
}

document.getElementById('closeModalBtn').addEventListener('click', () => {
  document.getElementById('caseModal').classList.remove('show');
});

// ================== BATTLE ==================
function renderBattleSelect() {
  const sel = document.getElementById('battleCaseSelect');
  sel.innerHTML = '';
  CASES.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = `${c.emoji} ${c.name} — ${formatMoney(c.price)}`;
    sel.appendChild(opt);
  });
  sel.value = selectedBattleCase;
  sel.addEventListener('change', () => { selectedBattleCase = sel.value; });
}

document.getElementById('openBattleBtn').addEventListener('click', () => {
  if (spinning) return;
  const c = CASES.find(x => x.id === selectedBattleCase);
  if (!c) return;
  if (state.balance < c.price) { showToast('Недостаточно средств!', 'error'); return; }

  spinning = true;
  state.balance -= c.price;
  state.totalSpent += c.price;
  updateStats();
  renderCases();
  document.getElementById('battleResult').textContent = '';
  document.getElementById('openBattleBtn').disabled = true;

  const track = document.getElementById('rouletteTrack');
  track.innerHTML = '';
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';

  const itemW = window.innerWidth < 600 ? 120 : 150;
  const itemCount = 60;
  // Рандомная позиция выигрыша — не всегда в одном месте
  const winIndex = 15 + Math.floor(Math.random() * (itemCount - 30));

  let winSkin = null;
  for (let i = 0; i < itemCount; i++) {
    let skin;
    if (i === winIndex) { skin = rollSkin(c); winSkin = skin; }
    else skin = rollSkin(c);
    const el = document.createElement('div');
    el.className = 'roulette-item';
    const rar = RARITIES[skin.rarity];
    el.style.borderTop = `4px solid ${rar.color}`;
    el.style.background = `linear-gradient(180deg, ${rar.color}22, transparent)`;
    el.innerHTML = `
      ${skinVisualHTML(skin, false)}
      <div class="name">${skin.name}</div>
    `;
    track.appendChild(el);
  }

  const container = track.parentElement;
  const containerW = container.offsetWidth;
  const centerOffset = containerW / 2 - itemW / 2;
  // Случайное смещение внутри предмета
  const jitter = (Math.random() - 0.5) * (itemW * 0.6);
  const targetX = -(winIndex * itemW) + centerOffset + jitter;

  setTimeout(() => {
    track.style.transition = 'transform 6s cubic-bezier(0.15, 0.9, 0.25, 1)';
    track.style.transform = `translateX(${targetX}px)`;
  }, 50);

  setTimeout(() => {
    state.inventory.push(winSkin);
    state.totalOpened++;
    save();
    updateStats();
    renderInventory();
    renderUpgradePicker();
    renderCases();

    const rar = RARITIES[winSkin.rarity];
    document.getElementById('battleResult').innerHTML =
      `<span style="color:${rar.color}">${winSkin.weaponEmoji} ${winSkin.name} — ${formatMoney(winSkin.price)} (${rar.name})</span>`;

    spinning = false;
    document.getElementById('openBattleBtn').disabled = false;
  }, 6200);
});

// ================== INVENTORY ==================
function renderInventory() {
  const grid = document.getElementById('inventoryGrid');
  if (state.inventory.length === 0) {
    grid.innerHTML = '<div class="empty-msg">Инвентарь пуст. Откройте кейс!</div>';
    return;
  }
  grid.innerHTML = '';
  const sorted = [...state.inventory].sort((a,b)=>b.price - a.price);
  sorted.forEach(skin => {
    const el = document.createElement('div');
    el.className = `inv-item rarity-${skin.rarity}`;
    const rar = RARITIES[skin.rarity];
    el.innerHTML = `
      ${skinVisualHTML(skin)}
      <div class="rarity-tag" style="color:${rar.color}">${rar.name}</div>
      <div class="name">${skin.name}</div>
      <div class="price">${formatMoney(skin.price)}</div>
      <button class="btn sell small" data-sell="${skin.id}">💰 Продать</button>
    `;
    grid.appendChild(el);
  });

  grid.querySelectorAll('[data-sell]').forEach(btn => {
    btn.addEventListener('click', () => sellSkin(btn.dataset.sell));
  });
}

function sellSkin(id) {
  const idx = state.inventory.findIndex(s => s.id === id);
  if (idx === -1) return;
  const skin = state.inventory[idx];
  state.balance += skin.price;
  state.inventory.splice(idx, 1);
  save();
  updateStats();
  renderInventory();
  renderUpgradePicker();
  renderCases();
  if (upgradeFromSkin && upgradeFromSkin.id === id) {
    upgradeFromSkin = null;
    renderUpgradeSlots();
  }
  showToast(`Продано: ${skin.name} за ${formatMoney(skin.price)}`, 'success');
}

document.getElementById('sellAllBtn').addEventListener('click', () => {
  if (state.inventory.length === 0) { showToast('Инвентарь пуст', 'error'); return; }
  const total = state.inventory.reduce((s,i)=>s+i.price, 0);
  state.balance += total;
  state.inventory = [];
  upgradeFromSkin = null;
  save();
  updateStats();
  renderInventory();
  renderUpgradePicker();
  renderUpgradeSlots();
  renderCases();
  showToast(`Продано всё за ${formatMoney(total)}`, 'success');
});

// ================== UPGRADER ==================
function renderMultiplierBar() {
  const bar = document.getElementById('multiplierBar');
  bar.innerHTML = '';
  MULTIPLIERS.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'mult-btn' + (m === upgradeMultiplier ? ' active' : '');
    btn.textContent = '×' + m;
    btn.disabled = wheelSpinning || !upgradeFromSkin;
    btn.addEventListener('click', () => {
      if (wheelSpinning) return;
      upgradeMultiplier = m;
      renderMultiplierBar();
      renderUpgradeSlots();
      renderUpgradeWheel();
    });
    bar.appendChild(btn);
  });
}

function getUpgradeTarget(fromSkin, multiplier) {
  const targetPrice = Math.round(fromSkin.price * multiplier);
  let best = SKINS_POOL[0];
  let bestDiff = Math.abs(SKINS_POOL[0].price - targetPrice);
  SKINS_POOL.forEach(s => {
    const d = Math.abs(s.price - targetPrice);
    if (d < bestDiff) { best = s; bestDiff = d; }
  });
  return {
    weapon: best.weapon,
    weaponName: WEAPONS[best.weapon].name,
    weaponEmoji: WEAPONS[best.weapon].emoji,
    skinName: best.skinName,
    name: WEAPONS[best.weapon].name + ' | ' + best.skinName,
    price: targetPrice,
    rarity: best.rarity,
    colors: best.colors,
    float: (Math.random() * 0.5 + 0.01).toFixed(3)
  };
}

function calculateChance(fromPrice, toPrice) {
  const ratio = fromPrice / toPrice;
  let chance = ratio * 100;
  chance = Math.max(3, Math.min(95, chance));
  return Math.round(chance * 10) / 10;
}

function renderUpgradeSlots() {
  const fromEl = document.getElementById('upgFromSlot');
  const toEl = document.getElementById('upgToSlot');
  const chanceBig = document.getElementById('chanceBig');
  const profitInfo = document.getElementById('profitInfo');
  const btn = document.getElementById('doUpgradeBtn');

  if (!upgradeFromSkin) {
    fromEl.className = 'upg-slot empty';
    fromEl.innerHTML = 'Выберите скин из инвентаря ниже';
    toEl.className = 'upg-slot empty';
    toEl.innerHTML = 'Выберите скин для апгрейда';
    chanceBig.textContent = '—';
    chanceBig.className = 'chance-big';
    profitInfo.innerHTML = '';
    btn.disabled = true;
    return;
  }

  const target = getUpgradeTarget(upgradeFromSkin, upgradeMultiplier);
  const chance = calculateChance(upgradeFromSkin.price, target.price);

  const rarFrom = RARITIES[upgradeFromSkin.rarity];
  const rarTo = RARITIES[target.rarity];

  fromEl.className = `upg-slot rarity-${upgradeFromSkin.rarity}`;
  fromEl.innerHTML = `
    ${skinVisualHTML(upgradeFromSkin)}
    <div class="name">${upgradeFromSkin.name}</div>
    <div class="price">${formatMoney(upgradeFromSkin.price)}</div>
    <div class="rarity-tag" style="color:${rarFrom.color}">${rarFrom.name}</div>
  `;

  toEl.className = `upg-slot rarity-${target.rarity}`;
  toEl.innerHTML = `
    ${skinVisualHTML(target)}
    <div class="name">${target.name}</div>
    <div class="price">${formatMoney(target.price)}</div>
    <div class="rarity-tag" style="color:${rarTo.color}">${rarTo.name}</div>
  `;

  chanceBig.textContent = chance + '%';
  chanceBig.className = 'chance-big' + (chance < 20 ? ' low' : chance < 50 ? ' mid' : '');

  const profit = target.price - upgradeFromSkin.price;
  profitInfo.innerHTML = `Прибыль при успехе: <span class="plus">+${formatMoney(profit)}</span> · Потеря при провале: <span class="minus">-${formatMoney(upgradeFromSkin.price)}</span>`;

  btn.disabled = false;
  return { target, chance };
}

// ================== WHEEL ==================
const SEGMENTS = 20;

function renderUpgradeWheel() {
  const outer = document.getElementById('upgWheelOuter');
  if (!upgradeFromSkin) {
    outer.innerHTML = '';
    outer._greenSegments = [];
    outer._redSegments = [];
    return;
  }
  const target = getUpgradeTarget(upgradeFromSkin, upgradeMultiplier);
  const chance = calculateChance(upgradeFromSkin.price, target.price);

  const greenCount = Math.max(1, Math.round(SEGMENTS * chance / 100));
  const segments = [];
  for (let i = 0; i < SEGMENTS; i++) segments.push(i < greenCount ? 'green' : 'red');
  for (let i = segments.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [segments[i], segments[j]] = [segments[j], segments[i]];
  }

  const size = 260;
  const cx = size / 2, cy = size / 2, r = size / 2 - 4;
  const segAngle = 360 / SEGMENTS;

  let svg = `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#0a0d1a"/>`;

  segments.forEach((type, i) => {
    const startAngle = i * segAngle - 90 - segAngle / 2;
    const endAngle = startAngle + segAngle;
    const startRad = (startAngle * Math.PI) / 180;
    const endRad = (endAngle * Math.PI) / 180;

    const x1 = cx + r * Math.cos(startRad);
    const y1 = cy + r * Math.sin(startRad);
    const x2 = cx + r * Math.cos(endRad);
    const y2 = cy + r * Math.sin(endRad);

    const path = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2} Z`;
    const fill = type === 'green' ? 'url(#greenGrad)' : 'url(#redGrad)';
    svg += `<path d="${path}" fill="${fill}" stroke="#0a0d1a" stroke-width="1.5"/>`;
  });

  svg += `
    <defs>
      <radialGradient id="greenGrad" cx="50%" cy="50%">
        <stop offset="0%" stop-color="#5ac06a"/>
        <stop offset="100%" stop-color="#2a6a3a"/>
      </radialGradient>
      <radialGradient id="redGrad" cx="50%" cy="50%">
        <stop offset="0%" stop-color="#d04a5a"/>
        <stop offset="100%" stop-color="#7a1a2a"/>
      </radialGradient>
    </defs>
  `;

  svg += `</svg>`;
  outer.innerHTML = svg;

  outer._greenSegments = segments.map((t, i) => t === 'green' ? i : -1).filter(i => i >= 0);
  outer._redSegments = segments.map((t, i) => t === 'red' ? i : -1).filter(i => i >= 0);
  outer._segAngle = segAngle;
  outer._segments = segments;
}

// Универсальная функция прокрутки стрелки на выбранный сегмент
function spinArrowToSegment(segmentIndex, duration = 5000) {
  return new Promise(resolve => {
    const arrow = document.getElementById('upgArrow');
    const outer = document.getElementById('upgWheelOuter');
    const segAngle = outer._segAngle || 18;

    // Сегмент i: центр находится под углом (i * segAngle) от вертикали вверх, по часовой стрелке.
    // Стрелка "0deg" смотрит вправо (3 часа). Нам нужно: arrow_angle = i*segAngle - 90.
    const segCenter = segmentIndex * segAngle - 90;
    // Разброс внутри сегмента, чтобы не всегда в центр
    const jitter = (Math.random() - 0.5) * (segAngle * 0.7);
    // Разное число оборотов для рандома
    const fullTurns = 5 + Math.floor(Math.random() * 5); // 5-9 оборотов
    const finalAngle = fullTurns * 360 + segCenter + jitter;

    arrow.classList.remove('spinning');
    arrow.classList.add('instant');
    arrow.style.transform = 'translateY(-50%) rotate(0deg)';
    void arrow.offsetWidth;

    setTimeout(() => {
      arrow.classList.remove('instant');
      arrow.classList.add('spinning');
      arrow.style.transitionDuration = duration + 'ms';
      arrow.style.transform = `translateY(-50%) rotate(${finalAngle}deg)`;
      setTimeout(() => resolve(segmentIndex), duration + 100);
    }, 30);
  });
}

// ================== UPGRADE ACTION ==================
document.getElementById('doUpgradeBtn').addEventListener('click', async () => {
  if (!upgradeFromSkin || wheelSpinning) return;

  const idx = state.inventory.findIndex(s => s.id === upgradeFromSkin.id);
  if (idx === -1) { upgradeFromSkin = null; renderUpgradeSlots(); return; }

  const target = getUpgradeTarget(upgradeFromSkin, upgradeMultiplier);
  const chance = calculateChance(upgradeFromSkin.price, target.price);
  const roll = Math.random() * 100;
  const isWin = roll < chance;

  wheelSpinning = true;
  document.getElementById('doUpgradeBtn').disabled = true;
  document.getElementById('upgResult').textContent = '';
  renderMultiplierBar();

  renderUpgradeWheel();
  const outer = document.getElementById('upgWheelOuter');

  // Сбрасываем стрелку
  const arrow = document.getElementById('upgArrow');
  arrow.classList.remove('spinning');
  arrow.classList.add('instant');
  arrow.style.transitionDuration = '0ms';
  arrow.style.transform = 'translateY(-50%) rotate(0deg)';
  void arrow.offsetWidth;

  // Выбираем целевой сегмент
  let targetSegment;
  if (isWin) {
    const greens = outer._greenSegments;
    targetSegment = greens[Math.floor(Math.random() * greens.length)];
  } else {
    const reds = outer._redSegments;
    targetSegment = reds[Math.floor(Math.random() * reds.length)];
  }

  const duration = 4500 + Math.random() * 1500; // 4.5-6 сек
  await spinArrowToSegment(targetSegment, duration);

  // Результат
  const currentIdx = state.inventory.findIndex(s => s.id === upgradeFromSkin.id);
  if (currentIdx !== -1) {
    if (isWin) {
      const newSkin = {
        id: uid(),
        weapon: target.weapon,
        weaponName: target.weaponName,
        weaponEmoji: target.weaponEmoji,
        skinName: target.skinName,
        name: target.name,
        price: target.price,
        rarity: target.rarity,
        colors: target.colors,
        float: target.float
      };
      state.inventory.splice(currentIdx, 1);
      state.inventory.push(newSkin);
      document.getElementById('upgResult').innerHTML =
        `<span style="color:#4aa05a;">✅ УСПЕХ! ${newSkin.name} — ${formatMoney(newSkin.price)}</span>`;
      showToast(`✅ Апгрейд успешен! ${newSkin.name}`, 'success');
    } else {
      const lostSkin = state.inventory[currentIdx];
      state.inventory.splice(currentIdx, 1);
      document.getElementById('upgResult').innerHTML =
        `<span style="color:#d03a3a;">❌ ПРОВАЛ! ${lostSkin.name} сгорел</span>`;
      showToast(`❌ Провал! ${lostSkin.name} сгорел`, 'error');
    }
  }

  upgradeFromSkin = null;
  save();
  updateStats();
  renderInventory();
  renderUpgradePicker();
  renderUpgradeSlots();
  renderUpgradeWheel();
  renderCases();
  wheelSpinning = false;
  renderMultiplierBar();
});

// ================== PICKER ==================
function renderUpgradePicker() {
  const grid = document.getElementById('upgPickerGrid');
  document.getElementById('upgInvCount').textContent = state.inventory.length;
  if (state.inventory.length === 0) {
    grid.innerHTML = '<div class="empty-msg">Нет скинов для апгрейда</div>';
    return;
  }
  grid.innerHTML = '';
  const sorted = [...state.inventory].sort((a,b)=>b.price - a.price);
  sorted.forEach(skin => {
    const el = document.createElement('div');
    el.className = `picker-item rarity-${skin.rarity}`;
    el.innerHTML = `
      ${skinVisualHTML(skin, false)}
      <div class="name">${skin.name}</div>
      <div class="price">${formatMoney(skin.price)}</div>
    `;
    if (upgradeFromSkin && upgradeFromSkin.id === skin.id) el.classList.add('selected');
    el.addEventListener('click', () => {
      if (wheelSpinning) return;
      upgradeFromSkin = skin;
      renderUpgradeSlots();
      renderUpgradeWheel();
      renderUpgradePicker();
    });
    grid.appendChild(el);
  });
}

document.getElementById('clearUpgBtn').addEventListener('click', () => {
  if (wheelSpinning) return;
  upgradeFromSkin = null;
  renderUpgradeSlots();
  renderUpgradeWheel();
  renderUpgradePicker();
});

// ================== TABS ==================
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'inventory') renderInventory();
    if (tab.dataset.tab === 'upgrade') {
      renderUpgradePicker();
      renderUpgradeSlots();
      renderUpgradeWheel();
      renderMultiplierBar();
    }
  });
});

// ================== INIT ==================
function init() {
  load();
  updateStats();
  renderCases();
  renderBattleSelect();
  renderInventory();
  renderUpgradePicker();
  renderUpgradeSlots();
  renderUpgradeWheel();
  renderMultiplierBar();
  save();
}

init();
</script>
